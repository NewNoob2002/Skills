# embedded-engineering 规则库（机器可读）
#
# 收录范围：能被工具检查的规则、跨生态有冲突的规则、需要在审查/验证样例中按 ID 引用的规则。
# 不重复 references/ 的全文；每条规则用 ref 指回出处章节，细节以 references/ 为准。
#
# 字段：
#   id        <域>-<三位序号>，永不复用
#   title     一句话规则
#   level     mandatory（违反即 FAIL）| advisory（偏离需在报告中说明理由）
#   profiles  适用 profile，或 [all]
#   lang      [c] / [cpp] / [c, cpp]
#   source    规则来源（sources 中的键）
#   ref       出处：<技能内路径> §N（多处用列表）
#   when      适用条件（可选）
#   except    例外（可选）
#   verify    method: auto | review | test | measure；auto 必须给 tool，可给 check（工具内的检查项）
#   cost      遵守该规则的运行期/资源代价（可选）
#   conflicts 与之冲突、按 profile 裁决的规则 ID（可选，必须双向登记）
#
# 由 tools/validate_skill.py 的 rules 检查校验结构、引用与冲突对称性。

version: 1

profiles: [mcu-baremetal, mcu-rtos, zephyr, linux-kernel, linux-userspace]

sources:
  skill: "本技能的护栏与工作流（brunofbloq/embedded-agent-skills 结构，独立改写）"
  rovinax: "rovinax/embedded-skills（MIT），按 BARR-C 与实际工程修订"
  barr-c: "BARR-C:2018 Embedded C Coding Standard 与 Barr Group enforcement kit"
  freertos: "FreeRTOS 官方文档（Cortex-M 中断优先级、FromISR API、静态分配）"
  cmsis-rtos2: "CMSIS-RTOS2 API 文档（ISR 中可调用函数与超时约束）"
  zephyr: "Zephyr 官方 Code Style / Coding Guidelines / Contribution Guidelines / ztest 文档"
  linux: "Linux 内核树 Documentation/process/ 与 dev-tools/kunit/"
  core-guidelines: "C++ Core Guidelines"
  pigweed: "Pigweed embedded C++ guide 与 size optimizations"
  modm: "modm 编译期外设校验"
  etl: "ETL 固定容量容器与 ISR 队列"
  measured: "本技能在 Cortex-M0+/M4 上实测的开销数据（references/cpp/features.md §4）"
  posix: "POSIX / Linux man-pages（系统调用语义、async-signal-safe）"
  arm: "ARMv7-M / ARMv8-M Architecture Reference Manual（ARM DDI 0403 / DDI 0553）"
  riscv: "RISC-V Unprivileged / Privileged Specification"
  threadx: "Eclipse ThreadX 用户手册与 tx_api.h"
  mcuboot: "MCUboot 官方设计文档"

verify_tools:
  arch_lint:
    path: scripts/arch_lint.py
    checks: [layer_dependency, forbidden_include, hal_call, register_access, cycle]
  barrc_check:
    path: scripts/barrc/check.sh
  c_compiler_flags:
    path: assets/barr-c/COMPILER_FLAGS.md
  cpp_compiler_flags:
    path: assets/cpp/compile_flags.md
  cpp_cost:
    path: scripts/cpp_cost.py
    checks: [exceptions, rtti, heap, static_dtor, local_static_guard, throw_helpers, stdio_format, iostream, atomic_libcall, budget, diff]
  clang_tidy_cpp:
    path: assets/cpp/.clang-tidy
  negative_compile:
    path: references/verification/cpp-testing.md
  ceedling:
    path: references/verification/ceedling.md
  cpputest:
    path: references/verification/cpp-testing.md
  zephyr_compliance:
    external: "Zephyr 树 ./scripts/ci/check_compliance.py -c <range>"
  twister:
    external: "west twister -T <dir>"
  checkpatch:
    external: "Linux 树 ./scripts/checkpatch.pl --strict"
  kernel_build:
    external: "make W=1 与 make C=1（sparse）"
  dt_binding_check:
    external: "make dt_binding_check / dtbs_check"
  kunit:
    external: "./tools/testing/kunit/kunit.py run"
  sanitizers:
    external: "-fsanitize=address,undefined 的 host 构建"

rules:
  # ---------------------------------------------------------------- GEN：全 profile 的护栏与流程
  - id: GEN-001
    title: "flash、擦除、eFuse/OTP、option bytes、secure boot、驱动执行器或电源前，必须取得覆盖目标与影响范围的明确授权并说明恢复路径"
    level: mandatory
    profiles: [all]
    lang: [c, cpp]
    source: [skill]
    ref: SKILL.md §0
    verify:
      method: review

  - id: GEN-002
    title: "寄存器、位域、时钟、引脚复用、DMA 通道、errata、SDK API 必须有仓库内或数据手册来源；查不到标 UNKNOWN 并提问"
    level: mandatory
    profiles: [all]
    lang: [c, cpp]
    source: [skill]
    ref: [SKILL.md §0, references/workflows/workflow.md §4]
    verify:
      method: review

  - id: GEN-003
    title: "host、静态、仿真、HIL、实测各自报告 PASS/FAIL/NOT_RUN/BLOCKED；未执行不得记为通过，仿真通过不等于硬件通过"
    level: mandatory
    profiles: [all]
    lang: [c, cpp]
    source: [skill]
    ref: [SKILL.md §0, references/workflows/workflow.md §5]
    verify:
      method: review

  - id: GEN-004
    title: "Agent 不添加 Signed-off-by；生成代码记录工具与模型，并由具名人类作者审查负责"
    level: mandatory
    profiles: [all]
    lang: [c, cpp]
    source: [skill, zephyr, linux, barr-c]
    ref: [SKILL.md §0, references/platforms/zephyr.md §5, references/platforms/linux-kernel.md §5, references/c/barr-c.md §6]
    verify:
      method: review

  - id: GEN-005
    title: "Full 深度的架构评审在 Phase 1 结束时必须取得明确批准才能进入实现"
    level: mandatory
    profiles: [all]
    lang: [c, cpp]
    source: [skill]
    ref: references/workflows/workflow.md §1
    except: "Fast path（孤立缺陷）不需要架构门"
    verify:
      method: review

  - id: GEN-006
    title: "测试 oracle 来自需求、规格或测试向量，不复制实现的输出"
    level: mandatory
    profiles: [all]
    lang: [c, cpp]
    source: [skill]
    ref: references/workflows/workflow.md §5
    verify:
      method: review

  - id: GEN-007
    title: "厂商生成代码（CubeMX、MCUXpresso、platform/）不重排、不格式化，只在 USER CODE 保护区修改，并排除出格式门禁"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos, linux-userspace]
    lang: [c, cpp]
    source: [skill]
    ref: references/profiles.md §4
    verify:
      method: review

  - id: GEN-008
    title: "向 Zephyr、Linux 主线或厂商上游提交的代码只使用该上游规范，不混入 BARR-C 格式或 g_ 前缀"
    level: mandatory
    profiles: [zephyr, linux-kernel]
    lang: [c]
    source: [skill, zephyr, linux]
    ref: references/profiles.md §4
    verify:
      method: review

  - id: GEN-009
    title: "所有等待外设的操作有界；超时所用时钟在该启动/休眠阶段有效；tick 比较处理回绕"
    level: mandatory
    profiles: [all]
    lang: [c, cpp]
    source: [skill, rovinax]
    ref: [references/workflows/workflow.md §4, references/rtos/mcu-isr-rtos.md §4]
    verify:
      method: test
    cost: "每个等待点需要超时分支与错误码"

  - id: GEN-010
    title: "外部输入（总线、网络、串口、文件、环境变量）在使用前校验长度与范围"
    level: mandatory
    profiles: [all]
    lang: [c, cpp]
    source: [barr-c, zephyr, posix]
    ref: [references/platforms/linux-userspace.md §2, references/platforms/zephyr.md §2]
    verify:
      method: test

  # ---------------------------------------------------------------- ARCH：MCU 分层架构
  - id: ARCH-001
    title: "#include 方向符合层规则：app → module → interface ← bsp/driver → platform"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos]
    lang: [c, cpp]
    source: [rovinax]
    ref: references/architecture/mcu-architecture.md §3
    verify:
      method: auto
      tool: arch_lint
      check: layer_dependency

  - id: ARCH-002
    title: "app、module、interface、driver/device 不包含厂商 HAL/CMSIS/设备头"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos]
    lang: [c, cpp]
    source: [rovinax]
    ref: references/architecture/mcu-architecture.md §3
    verify:
      method: auto
      tool: arch_lint
      check: forbidden_include

  - id: ARCH-003
    title: "module、interface、driver/device 不直接包含 RTOS 头；同步原语经 OSAL 接口或模板参数注入"
    level: mandatory
    profiles: [mcu-rtos]
    lang: [c, cpp]
    source: [rovinax]
    ref: references/architecture/mcu-architecture.md §3
    verify:
      method: auto
      tool: arch_lint
      check: forbidden_include

  - id: ARCH-004
    title: "app、module、interface、driver/device 中不调用 HAL/LL/nrfx 函数"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos]
    lang: [c, cpp]
    source: [rovinax]
    ref: references/architecture/mcu-architecture.md §3
    verify:
      method: auto
      tool: arch_lint
      check: hal_call

  - id: ARCH-005
    title: "app、module、interface、driver/device 中不出现 PERIPH->REG 形式的寄存器访问"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos]
    lang: [c, cpp]
    source: [rovinax]
    ref: references/architecture/mcu-architecture.md §3
    verify:
      method: auto
      tool: arch_lint
      check: register_access

  - id: ARCH-006
    title: "module 子模块之间无循环依赖"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos]
    lang: [c, cpp]
    source: [rovinax]
    ref: references/architecture/mcu-architecture.md §3
    verify:
      method: auto
      tool: arch_lint
      check: cycle

  - id: ARCH-007
    title: "器件驱动状态放在设备上下文结构体中，不用文件级全局状态；初始化分阶段且逐步检查返回值"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos]
    lang: [c, cpp]
    source: [rovinax]
    ref: references/architecture/mcu-architecture.md §4
    verify:
      method: review
    cost: "每次调用多传一个上下文指针"

  - id: ARCH-008
    title: "驱动的 host 测试 mock 总线接口头，而不是 HAL"
    level: advisory
    profiles: [mcu-baremetal, mcu-rtos]
    lang: [c, cpp]
    source: [rovinax]
    ref: references/architecture/mcu-architecture.md §4
    verify:
      method: review

  # ---------------------------------------------------------------- C：BARR-C 安全核心（与格式无关）
  - id: C-001
    title: "volatile 不用于线程/任务同步；多字节、读-改-写、多核共享用临界区、RTOS 原语或原子类型"
    level: mandatory
    profiles: [all]
    lang: [c, cpp]
    source: [barr-c, linux, core-guidelines]
    ref: [references/c/barr-c.md §2, references/rtos/mcu-isr-rtos.md §2, references/profiles.md §3]
    verify:
      method: review

  - id: C-002
    title: "模块外不需要的函数和变量一律 static；私有函数 static，公共函数在头文件中有原型"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos, linux-userspace]
    lang: [c]
    source: [barr-c]
    ref: references/c/barr-c.md §2
    verify:
      method: review

  - id: C-003
    title: "不注释掉代码；临时禁用用 #if 0"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos, zephyr, linux-userspace]
    lang: [c, cpp]
    source: [barr-c, zephyr]
    ref: [references/c/barr-c.md §2, references/platforms/zephyr.md §2]
    verify:
      method: review

  - id: C-004
    title: "整数宽度重要时用 stdint.h 定宽类型；char 只用于字符"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos, zephyr, linux-userspace]
    lang: [c]
    source: [barr-c, zephyr]
    ref: references/c/barr-c.md §2
    verify:
      method: review

  - id: C-005
    title: "位运算符不作用于有符号操作数"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos]
    lang: [c]
    source: [barr-c]
    ref: references/c/barr-c.md §2
    verify:
      method: auto
      tool: barrc_check

  - id: C-006
    title: "比较与算术中不混用有符号与无符号"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos, linux-userspace]
    lang: [c]
    source: [barr-c]
    ref: [references/c/barr-c.md §2, references/c/barr-c.md §4]
    verify:
      method: auto
      tool: c_compiler_flags
      check: "-Wsign-compare"

  - id: C-007
    title: "不对浮点做 == / != 比较"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos, linux-userspace]
    lang: [c, cpp]
    source: [barr-c]
    ref: [references/c/barr-c.md §2, references/c/barr-c.md §4]
    verify:
      method: auto
      tool: c_compiler_flags
      check: "-Wfloat-equal"

  - id: C-008
    title: "映射硬件寄存器或通信帧的结构体防止填充与位序变化，并用 static_assert(sizeof) 校验"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos, linux-userspace]
    lang: [c]
    source: [barr-c]
    ref: [references/c/barr-c.md §2, references/c/barr-c.md §5]
    verify:
      method: review

  - id: C-009
    title: "能写成函数就不用带参宏；带参宏整体与每个参数加括号、参数只用一次、不含控制转移"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos]
    lang: [c]
    source: [barr-c]
    ref: references/c/barr-c.md §2
    verify:
      method: auto
      tool: barrc_check

  - id: C-010
    title: "变量使用前初始化；尚无地址的指针初始化为 NULL"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos, zephyr, linux-userspace]
    lang: [c]
    source: [barr-c]
    ref: references/c/barr-c.md §2
    verify:
      method: auto
      tool: c_compiler_flags
      check: "-Wall"

  - id: C-011
    title: "if / else if 条件中不赋值"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos, linux-userspace]
    lang: [c]
    source: [barr-c]
    ref: [references/c/barr-c.md §2, references/c/barr-c.md §4]
    verify:
      method: auto
      tool: c_compiler_flags
      check: "-Werror=parentheses"

  - id: C-012
    title: "每个 switch 有 default"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos, linux-userspace]
    lang: [c]
    source: [barr-c]
    ref: references/c/barr-c.md §2
    verify:
      method: auto
      tool: c_compiler_flags
      check: "-Wswitch-default"

  - id: C-013
    title: "有意的 switch 贯穿必须用平台方式标注：BARR-C 注释、Zephyr __fallthrough、Linux fallthrough;"
    level: mandatory
    profiles: [all]
    lang: [c]
    source: [barr-c, zephyr, linux]
    ref: [references/c/barr-c.md §2, references/profiles.md §3]
    verify:
      method: auto
      tool: c_compiler_flags
      check: "-Wimplicit-fallthrough"

  - id: C-014
    title: "禁止隐式函数声明"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos, linux-userspace]
    lang: [c]
    source: [barr-c]
    ref: references/c/barr-c.md §4
    verify:
      method: auto
      tool: c_compiler_flags
      check: "-Werror=implicit-function-declaration"

  - id: C-015
    title: "不调用 abort、exit、setjmp、longjmp"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos]
    lang: [c]
    source: [barr-c]
    ref: references/c/barr-c.md §2
    verify:
      method: auto
      tool: barrc_check

  - id: C-016
    title: "头文件用 #ifndef guard，不用 #pragma once"
    level: mandatory
    profiles: [all]
    lang: [c]
    source: [barr-c, zephyr, linux]
    ref: [references/c/barr-c.md §2, references/profiles.md §3]
    verify:
      method: review

  - id: C-017
    title: "每个强制类型转换配注释说明数值范围为何安全"
    level: advisory
    profiles: [mcu-baremetal, mcu-rtos]
    lang: [c]
    source: [barr-c]
    ref: references/c/barr-c.md §2
    verify:
      method: review

  - id: C-018
    title: "以 C99 编写并用 -std=c99 锁定方言"
    level: advisory
    profiles: [mcu-baremetal, mcu-rtos]
    lang: [c]
    source: [barr-c]
    ref: references/c/barr-c.md §2
    except: "项目已明确选用更新的 C 标准时按项目"
    verify:
      method: auto
      tool: c_compiler_flags
      check: "-std=c99"

  # ---------------------------------------------------------------- CFMT：BARR-C 格式与命名层（与 Zephyr/Linux 冲突）
  - id: CFMT-001
    title: "BARR-C 布局：4 空格缩进、禁止 tab、Allman 花括号、行宽 80、只用 LF"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos]
    lang: [c]
    source: [barr-c]
    ref: [references/c/barr-c.md §3, references/profiles.md §3]
    when: "linux-userspace 项目未定义风格且选用 BARR-C 格式层时同样适用"
    verify:
      method: auto
      tool: barrc_check
    conflicts: [ZEP-001, LNXK-001]

  - id: CFMT-002
    title: "所有 if/else/for/while/do/switch 体加花括号，单语句也加"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos]
    lang: [c]
    source: [barr-c]
    ref: [references/c/barr-c.md §3, references/profiles.md §3]
    verify:
      method: auto
      tool: barrc_check
    conflicts: [LNXK-001]

  - id: CFMT-003
    title: "命名前缀：全局 g_、指针 p_/pp_、布尔 b_、句柄 h_"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos]
    lang: [c]
    source: [barr-c]
    ref: [references/c/barr-c.md §3, references/profiles.md §3]
    verify:
      method: auto
      tool: barrc_check
    conflicts: [LNXK-002]

  - id: CFMT-004
    title: "变量与常量比较时常量在左（NULL == p_buf）"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos]
    lang: [c]
    source: [barr-c]
    ref: [references/c/barr-c.md §3, references/profiles.md §3]
    verify:
      method: review
    conflicts: [LNXK-001]

  - id: CFMT-005
    title: "不使用 short / long，用定宽类型"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos]
    lang: [c]
    source: [barr-c]
    ref: [references/c/barr-c.md §3, references/profiles.md §3]
    verify:
      method: auto
      tool: barrc_check
    conflicts: [LNXK-001]

  - id: CFMT-006
    title: "尽量不用 goto"
    level: advisory
    profiles: [mcu-baremetal, mcu-rtos]
    lang: [c]
    source: [barr-c]
    ref: [references/c/barr-c.md §3, references/profiles.md §3]
    verify:
      method: auto
      tool: barrc_check
    conflicts: [LNXK-003]

  - id: CFMT-007
    title: "自写 ISR 名以 _isr 结尾并声明为 static；向量表固定名只做一行转发"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos]
    lang: [c]
    source: [barr-c]
    ref: [references/c/barr-c.md §3, references/rtos/mcu-isr-rtos.md §1]
    except: "启动文件要求的向量名（如 USART1_IRQHandler）作为记录在案的例外"
    verify:
      method: review

  # ---------------------------------------------------------------- ISR / RTOS / DMA
  - id: ISR-001
    title: "ISR 只捕获事件：不解析协议、不做控制计算、不打日志、不分配内存、不阻塞、不调用非 ISR 安全 API"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos]
    lang: [c, cpp]
    source: [rovinax, barr-c]
    ref: [references/rtos/mcu-isr-rtos.md §1, references/cpp/coding.md §7]
    verify:
      method: review

  - id: ISR-002
    title: "写 1 清除（W1C）的状态寄存器直接赋值，不用 |= 读-改-写"
    level: mandatory
    profiles: [mcu-baremetal, mcu-rtos]
    lang: [c, cpp]
    source: [rovinax]
    ref: references/rtos/mcu-isr-rtos.md §2
    verify:
      method: review

  - id: ISR-003
