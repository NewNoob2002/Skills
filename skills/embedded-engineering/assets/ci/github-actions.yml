# 固件仓库 CI 模板（GitHub Actions）。复制到目标仓库的 .github/workflows/firmware.yml 后按项目修改。
#
# 前提：本技能以 git submodule 或 vendored 副本放在目标仓库的 tools/embedded-engineering/ 下；
#       CI 不能引用开发机上的技能安装目录。
# 尖括号占位符（<...>）必须替换；不适用的 job 直接删除，不要留着让它“跳过”。
# 本模板只做构建、静态检查与 host 测试；flash、HIL 等硬件动作不放进 CI（GEN-001）。
name: firmware

on:
  pull_request:
  push:
    branches: [main]

env:
  SKILL_DIR: tools/embedded-engineering
  CEEDLING_VERSION: "1.2.2"   # 本技能核实的基线版本；改为项目锁定的版本（references/verification/ceedling.md）

jobs:
  static:
    runs-on: ubuntu-24.04
    # 固定 digest 的项目镜像含 LLVM 23；门禁同时校验 llvm_major。
    container: <registry>/firmware-tools@sha256:<digest>
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure real compilation database
        run: cmake --preset <analysis-preset> -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Layering (ARCH-001..006)
        run: python3 "$SKILL_DIR/scripts/arch_lint.py" .
      # style-gate.json: 显式 c/cpp/cpp_headers 范围，空集不回退全仓。
      # C 调 BARR-C；C++ 布局/命名由所选配置与真实数据库检查（CPPF-001/002）。
      - name: Selected C and C++ gates (optional DOC-001)
        run: >-
          python3 "$SKILL_DIR/scripts/style_gate.py"
          --root . --manifest style-gate.json

  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ceedling
        run: sudo gem install ceedling -v "$CEEDLING_VERSION"
      - name: C unit tests (Ceedling, TEST-001/TEST-002)
        run: ceedling test:all
      - name: C++ unit tests (CppUTest via CMake)
        run: cmake -S <tests/cpp> -B build-host && cmake --build build-host && ctest --test-dir build-host --output-on-failure

  # 仅 MCU 固件选择此 job；Linux 用户态沿用自身构建，不套 T1/链接裁剪门禁。
  target-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build
      - name: Build
        run: cmake --preset <target-preset> && cmake --build --preset <target-preset>
      - name: Forbidden runtime and size budget (CPP-001..009, TEST-004)
        run: python3 "$SKILL_DIR/scripts/cpp_cost.py" check <build/app.elf> --tier <T1> --budget <budget.json>
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            <build/app.elf>
            <build/app.map>
